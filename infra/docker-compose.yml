services:
  # ── MongoDB ───────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: kneevision
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Node.js / Express) ───────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      # For local dev, point at the mongo container above.
      # Override with your Atlas URI in production:
      #   MONGODB_URI=mongodb+srv://user:pass@cluster.mongodb.net/kneevision
      MONGODB_URI: mongodb://mongo:27017/kneevision
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: 4000
      ML_SERVICE_URL: http://ml-service:8000
      NODE_ENV: production
    ports:
      - "4000:4000"
    volumes:
      # Named volume so uploaded files survive container restarts
      - uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:4000/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Frontend (React + Vite built, served by nginx) ────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # During docker build, Vite replaces this env var in the bundle.
        # If frontend container is behind a reverse-proxy that strips the
        # host, leave this as the nginx proxy target (empty = same host).
        VITE_BACKEND_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

  # ── ML Service (FastAPI / TensorFlow) ────────────────────────────────────
  ml-service:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MODEL_PATH: /app/model.hdf5
      LAST_CONV_LAYER_NAME: global_average_pooling2d
    ports:
      - "8000:8000" # expose for local debugging; remove in prod
    # GPU support (optional): uncomment if you have NVIDIA Docker runtime
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  mongodata:
  uploads:
