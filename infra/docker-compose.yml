services:
  # ── MongoDB (only for local development) ────────────────────────────────
  mongo:
    image: mongo:7
    restart: unless-stopped
    profiles: ["local"] # only start in local development
    environment:
      MONGO_INITDB_DATABASE: kneevision
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Node.js / Express) ─────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      ml-service:
        condition: service_started
    environment:
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
      ML_SERVICE_URL: http://ml-service:8000
      NODE_ENV: production
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:4000/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Frontend (React + Vite + nginx) ─────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

  # ── ML Service (FastAPI / TensorFlow) ───────────────────────────────────
  ml-service:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MODEL_PATH: /app/model.hdf5
      LAST_CONV_LAYER_NAME: global_average_pooling2d
    ports:
      - "8000:8000"

volumes:
  mongodata:
  uploads:
